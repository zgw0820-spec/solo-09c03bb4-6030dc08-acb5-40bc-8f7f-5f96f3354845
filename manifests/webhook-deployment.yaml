# 可选：把 webhook 部署进真实集群（本地 Docker Compose 演示不需要本文件）。
# 镜像需先构建并推送到集群可达的镜像仓库：
#   docker build -t <registry>/backup-policy-converter:1.0.0 .
#   docker push <registry>/backup-policy-converter:1.0.0
# 证书：生产环境建议 cert-manager（见 crd-backuppolicy.yaml 顶部注释）；
# 本清单假设已通过某种方式把 TLS 证书挂进 Pod（secretName: converter-tls），
# 并让容器以 --ssl 参数或反向代理终止 TLS。简单起见，这里用 sidecar 之外的
# 常见做法：Service 443 -> 容器 8443（uvicorn 直接持证书）。
apiVersion: v1
kind: Namespace
metadata:
  name: backup-system
---
# 盘点 API 所需最小权限：读策略、写 status、分页列快照。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-policy-converter
  namespace: backup-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-policy-converter-audit
  namespace: backup-system
rules:
  - apiGroups: ["backup.example.com"]
    resources: ["backuppolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["backup.example.com"]
    resources: ["backuppolicies/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch"]
---
# 盘点可作用于任意命名空间的策略：按需给每个命名空间建同样的 RoleBinding，
# 或改用 ClusterRole/ClusterRoleBinding（这里给出示例绑定，按实际情况复制）。
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-policy-converter-audit
  namespace: backup-system
subjects:
  - kind: ServiceAccount
    name: backup-policy-converter
    namespace: backup-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-policy-converter-audit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-policy-converter
  namespace: backup-system
  labels:
    app: backup-policy-converter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backup-policy-converter
  template:
    metadata:
      labels:
        app: backup-policy-converter
    spec:
      serviceAccountName: backup-policy-converter
      containers:
        - name: webhook
          image: registry.example.com/backup-policy-converter:1.0.0
          env:
            # 盘点 API 直连 API server；token 由 kubelet 挂载并轮换。
            - name: KUBERNETES_API_URL
              value: https://kubernetes.default.svc
          args:
            - uvicorn
            - app.main:app
            - --host=0.0.0.0
            - --port=8443
            - --ssl-certfile=/tls/tls.crt
            - --ssl-keyfile=/tls/tls.key
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: 8443
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: 8443
      volumes:
        - name: tls
          secret:
            secretName: converter-tls
---
apiVersion: v1
kind: Service
metadata:
  name: backup-policy-converter
  namespace: backup-system
spec:
  selector:
    app: backup-policy-converter
  ports:
    - port: 443
      targetPort: 8443
